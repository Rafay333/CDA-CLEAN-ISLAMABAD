# Optional. The API runs without Docker by using a local database file.
# Start this when you want a standalone PostgreSQL server, then set
# DATABASE_URL=postgres://cda:cda@localhost:5432/cda_clean
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cda
      POSTGRES_PASSWORD: cda
      POSTGRES_DB: cda_clean
    ports:
      - "5432:5432"
    volumes:
      - cda_pg:/var/lib/postgresql/data

volumes:
  cda_pg:
